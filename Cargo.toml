[workspace]
resolver = "2"
members = ["crates/dos", "crates/fat", "crates/term", "crates/supervisor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Unlicense"
publish = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
overflow-checks = true
debug-assertions = true
